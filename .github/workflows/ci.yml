name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Doc check
        run: node scripts/doc-check.js
      - name: Version check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/version-check.js
      - name: Banned words
        env:
          BANNED_WORD: ${{ vars.BANNED_WORD }}
        run: |
          if grep -rn "$BANNED_WORD" src; then echo "src/ contains the word '$BANNED_WORD', which the project does not allow. Use another name."; exit 1; fi
